services:
  - type: web
    name: tomza-mant
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: tomza-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.18.0
      - key: TZ
        value: America/Costa_Rica
      - key: UPLOAD_ROOT
        value: /var/data/uploads
      - key: SESSION_SECRET
        generateValue: true
      - key: MYSQLHOST
        sync: false
      - key: MYSQLPORT
        sync: false
      - key: MYSQLUSER
        sync: false
      - key: MYSQLPASSWORD
        sync: false
      - key: MYSQLDATABASE
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
