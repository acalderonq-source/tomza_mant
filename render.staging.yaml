# Plantilla: crear solo despues de preparar una base de pruebas separada.
services:
  - type: web
    name: tomza-mant-staging
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    disk:
      name: tomza-staging-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: MAIL_ENABLED
        value: "false"
      - key: UPLOAD_ROOT
        value: /var/data/uploads
      - key: SESSION_SECRET
        generateValue: true
      - key: MYSQLHOST
        sync: false
      - key: MYSQLPORT
        sync: false
      - key: MYSQLUSER
        sync: false
      - key: MYSQLPASSWORD
        sync: false
      - key: MYSQLDATABASE
        sync: false
      - key: STAGING_DATABASE_NAME
        sync: false
      - key: PRODUCTION_DATABASE_NAME
        sync: false
      - key: MYSQL_SSL
        value: "true"
