plugins {
    id "com.android.application"
}

android {
    namespace "com.gastomza.taller"
    compileSdk 36

    defaultConfig {
        applicationId "com.gastomza.taller"
        minSdk 23
        targetSdk 36
        versionCode 3
        versionName "1.2.0"
        manifestPlaceholders = [screenOrientation: "landscape"]
    }

    flavorDimensions "dispositivo"
    productFlavors {
        pantalla { dimension "dispositivo" }
        movil {
            dimension "dispositivo"
            applicationIdSuffix ".movil"
            versionCode 2
            versionName "1.1.0"
            manifestPlaceholders = [screenOrientation: "unspecified"]
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
}
