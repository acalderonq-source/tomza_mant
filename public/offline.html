<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sin conexión | Tomza Taller</title>
  <style>
    body {
      align-items: center;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: #f8fafc;
      display: flex;
      font-family: "Segoe UI", Arial, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      max-width: 420px;
      padding: 1.5rem;
      text-align: center;
    }
    h1 { margin: 0 0 .75rem; }
    p { color: #cbd5e1; line-height: 1.5; }
    a {
      background: #dc2626;
      border-radius: 999px;
      color: white;
      display: inline-block;
      font-weight: 700;
      margin-top: 1rem;
      padding: .65rem 1rem;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Sin conexión</h1>
    <p>No se pudo conectar con el servidor. Cuando vuelva la señal, recarga la aplicación.</p>
    <a href="/dashboard">Intentar de nuevo</a>
  </main>
</body>
</html>
